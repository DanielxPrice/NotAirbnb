name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: not-airbnb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: not-airbnb/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - run: npm run build
        env:
          CI: true

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            not-airbnb/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix not-airbnb
      - run: npm run build --prefix not-airbnb
        env:
          CI: true
      - run: npx playwright install --with-deps chromium
        working-directory: server
      - run: npm run test:e2e --prefix server
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: server/test-results
